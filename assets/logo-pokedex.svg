<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 40" width="156" height="40" role="img" aria-label="Pokédex" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Solo la pokébola y el nombre, sobre fondo transparente.
    La pastilla amarilla la pone el CSS en el elemento contenedor.

    Sin media query a propósito: este logo vive sobre un fondo que definimos
    nosotros, no sobre el del sistema.
  -->

  <!-- Pokébola -->
  <circle cx="20" cy="20" r="16" fill="#F2F6FA" stroke="#142C52" stroke-width="3"/>
  <path d="M 4 20 A 16 16 0 0 1 36 20 Z" fill="#DC2D1A"/>
  <line x1="4" y1="20" x2="36" y2="20" stroke="#142C52" stroke-width="3"/>
  <circle cx="20" cy="20" r="5.5" fill="#F2F6FA" stroke="#142C52" stroke-width="3"/>

  <!-- Nombre -->
  <text x="46" y="29"
        font-family="Helvetica, Arial, sans-serif"
        font-size="24" font-weight="bold"
        letter-spacing="-0.3"
        fill="#142C52">Pokédex</text>
</svg>
