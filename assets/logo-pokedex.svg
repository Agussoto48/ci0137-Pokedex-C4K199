<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64">
  <style>
    .wordmark { font-family: Helvetica, Arial, sans-serif; font-size: 34px; font-weight: bold; letter-spacing: -0.5px; }
    .ink   { fill: #1a1a1a; }
    .accent{ fill: #e63946; }
    .ball-line { stroke: #1a1a1a; }
    .ball-base { fill: #f5f5f5; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f5f5f5; }
      .ball-line { stroke: #f5f5f5; }
      .ball-base { fill: #2a2a2a; }
    }
  </style>

  <circle class="ball-base ball-line" cx="32" cy="32" r="26" stroke-width="4"/>
  <path d="M 6 32 A 26 26 0 0 1 58 32 Z" class="accent"/>
  <line x1="6" y1="32" x2="58" y2="32" class="ball-line" stroke-width="4"/>
  <circle class="ball-base ball-line" cx="32" cy="32" r="9" stroke-width="4"/>
  <circle class="ball-base ball-line" cx="32" cy="32" r="3.5" stroke-width="2"/>

  <text x="74" y="44" class="wordmark">
    <tspan class="ink">Poké</tspan><tspan class="accent">dex</tspan>
  </text>
</svg>
