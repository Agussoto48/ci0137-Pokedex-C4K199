  <g font-size="11" fill="#333">
    <text x="358" y="90">Pokédex</text>
    <text x="432" y="90">Perfil de entrenador</text>
    <text x="571" y="90">Acerca de</text>
    <text x="655" y="90">Configuración</text>
  </g>
  <line x1="358" y1="96" x2="408" y2="96" stroke="#333" stroke-width="2"/>

  <!-- TITULO -->
  <text x="60" y="152" font-size="20" font-weight="bold" fill="#222">Lista de Pokémon</text>

  <!-- BUSCADOR -->
