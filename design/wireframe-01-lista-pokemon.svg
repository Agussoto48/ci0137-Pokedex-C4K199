  <text x="328" y="212" font-size="10" fill="#555">Tipo</text>
  <rect x="328" y="218" width="140" height="26" fill="#fff" stroke="#666"/>
  <polygon points="450,229 460,229 455,236" fill="#555"/>

  <text x="484" y="212" font-size="10" fill="#555">Ordenar por</text>
  <rect x="484" y="218" width="170" height="26" fill="#fff" stroke="#666"/>
  <polygon points="636,229 646,229 641,236" fill="#555"/>

  <rect x="670" y="218" width="54" height="26" fill="#333"/>
  <text x="697" y="235" font-size="10" fill="#fff" text-anchor="middle">Buscar</text>

