<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="700" fill="#ffffff"/>

  <text x="40" y="36" font-size="17" font-weight="bold" fill="#111">Lista de Pokémon</text>

  <rect x="40" y="56" width="720" height="584" fill="none" stroke="#333" stroke-width="2"/>

